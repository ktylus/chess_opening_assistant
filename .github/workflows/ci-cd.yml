name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest -m "not integration"

  # Publishes the production image to ECR, nothing deploys it yet.
  build-push:
    # Gated on the tests, and on the commit having landed on main -- a pull
    # request must never produce a pushed image. Both conditions matter: the
    # trust policy in terraform/github_oidc.tf would reject a pull request run
    # anyway, but failing here gives a comprehensible error instead of an
    # opaque STS denial.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets GitHub mint the OIDC token that AWS exchanges for credentials.
      # Omitting it fails with a missing-token error rather than a permissions
      # one, which is the single most common way this setup breaks.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve short commit SHA
        id: commit
        # github.sha is the full 40 characters, but scripts/compose-up.sh and
        # backend/observability/provenance.py both use git's 7-character
        # abbreviation. Truncating here keeps the image tag, the GIT_SHA baked
        # into the image, and every log line the same string -- which is the
        # whole point of tagging by commit.
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Repo root, matching compose.yaml: the Dockerfile lives in backend/
          # but reads pyproject.toml, uv.lock, data/ and frontend/ from here.
          context: .
          file: backend/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/chess-opening-assistant:${{ steps.commit.outputs.sha }}
          build-args: |
            GIT_SHA=${{ steps.commit.outputs.sha }}
          # The runner is a fresh machine every run, so without a cache each
          # build reinstalls npm packages and re-resolves the venv from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to App Runner
        env:
          SERVICE_ARN: ${{ secrets.AWS_APPRUNNER_SERVICE_ARN }}
          ACCESS_ROLE_ARN: ${{ secrets.AWS_APPRUNNER_ACCESS_ROLE_ARN }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/chess-opening-assistant:${{ steps.commit.outputs.sha }}
        # Auto-deployment is off (see terraform/apprunner.tf): the repository is
        # immutable and tagged by commit, so there is no fixed tag for App
        # Runner to watch and the deploy names the exact image instead.
        run: |
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration "ImageRepository={ImageIdentifier=$IMAGE,ImageRepositoryType=ECR},AuthenticationConfiguration={AccessRoleArn=$ACCESS_ROLE_ARN}" \
            --no-cli-pager

      - name: Wait for the deployment to settle
        env:
          SERVICE_ARN: ${{ secrets.AWS_APPRUNNER_SERVICE_ARN }}
        # update-service returns as soon as the operation is accepted, so
        # without this the job goes green while the new image is still being
        # rolled out -- and stays green if it never starts. App Runner has no
        # CLI waiter, hence the loop.
        run: |
          for _ in $(seq 60); do
            status="$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query 'Service.Status' --output text)"
            case "$status" in
              OPERATION_IN_PROGRESS) sleep 15 ;;
              RUNNING) echo "deployed"; exit 0 ;;
              *) echo "unexpected service status: $status" >&2; exit 1 ;;
            esac
          done
          echo "timed out waiting for the deployment" >&2
          exit 1
