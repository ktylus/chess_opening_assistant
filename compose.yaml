# Base configuration, shared by dev and prod.
#
# `docker compose up` also reads compose.override.yaml automatically, so the
# plain local run is the dev one. See compose.prod.yaml for the other path.
services:
  backend:
    build:
      # Context is the repo root (pyproject.toml, uv.lock, backend/, data/,
      # frontend/ all live there); the Dockerfile itself sits in backend/.
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Computed on the host (see scripts/compose-up.sh) and baked in, since
        # the container has no repository to read the commit from.
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # The image already sets this, but .env carries the host's path and
      # env_file wins over the image, so restate it here.
      STOCKFISH_PATH: /usr/games/stockfish
